[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sivacor-autoscaler"
version = "0.1.0"
description = "Creates and reaps OpenStack worker instances for SIVACOR submissions"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["openstacksdk>=1.0", "redis>=4", "girder-client"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
sivacor-autoscaler = "sivacor_autoscaler.__main__:main"

[tool.setuptools.packages.find]
include = ["sivacor_autoscaler*"]
